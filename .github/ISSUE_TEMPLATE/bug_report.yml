name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not attach real forms, filled-in PDFs or screenshots that show personal data.**
        Describe the form's layout in words, or reproduce the problem with a made-up form.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a scanned A4 form with …
        2. Switch to ② Fill out
        3. …
  - type: input
    id: version
    attributes:
      label: Scan2Form version
      placeholder: "0.1.0 (Windows zip) or git commit"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: My report contains no personal data and no real forms.
          required: true
