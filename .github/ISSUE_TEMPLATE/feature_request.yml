name: Feature request
description: An idea to make Scan2Form better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Scan2Form help?
  - type: markdown
    attributes:
      value: Please keep example forms fictitious — no personal data.
